    <!-- Live Audit Stream Items -->
    <g transform="translate(28, 76)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="679" height="92" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <rect x="16" y="16" width="36" height="36" rx="8" fill="#10b981" fill-opacity="0.2"/>
      <text x="24" y="38" fill="#34d399" font-size="14" font-weight="700">✓</text>
      <text x="64" y="28" fill="#38bdf8" font-size="11" font-weight="700">CROSS-STATE FHIR CONSENT UNLOCKED</text>
      <text x="560" y="28" fill="#64748b" font-size="10">2 MINS AGO</text>
      <text x="64" y="48" fill="#ffffff" font-size="12" font-weight="600">Patient: IND-MIG-2026-8841 (Ramesh Kumar) • ABHA OTP Verified</text>
      <text x="64" y="68" fill="#94a3b8" font-size="11">Requesting Node: Ernakulam Med College ➔ Provider: Patna Dist Hosp</text>
      <text x="64" y="82" fill="#64748b" font-size="10">SHA-256 Hash: 0x9b72f1c8340d... • Purpose: Emergency Triage</text>

      <!-- Item 2 -->
      <rect x="0" y="108" width="679" height="92" rx="10" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
      <rect x="16" y="124" width="36" height="36" rx="8" fill="#ef4444" fill-opacity="0.2"/>
      <text x="24" y="146" fill="#f87171" font-size="14" font-weight="700">⚠</text>
      <text x="64" y="136" fill="#f87171" font-size="11" font-weight="700">OUTBREAK ALERT BROADCAST DISPATCHED</text>
      <text x="560" y="136" fill="#64748b" font-size="10">14 MINS AGO</text>
      <text x="64" y="156" fill="#ffffff" font-size="12" font-weight="600">Cluster: Perumbavoor Plywood Industrial Corridor (42 Cases)</text>
      <text x="64" y="176" fill="#94a3b8" font-size="11">Intervention: 2 Mobile Medical Vans Deployed + N95 Mask Mandate</text>
      <text x="64" y="190" fill="#64748b" font-size="10">Authorized by: Dr. S. Nambiar (State Surveillance Officer)</text>

      <!-- Item 3 -->
      <rect x="0" y="216" width="679" height="92" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <rect x="16" y="232" width="36" height="36" rx="8" fill="#0284c7" fill-opacity="0.2"/>
      <text x="24" y="254" fill="#38bdf8" font-size="14" font-weight="700">⇄</text>
      <text x="64" y="244" fill="#38bdf8" font-size="11" font-weight="700">INTER-HOSPITAL BED REALLOCATION</text>
      <text x="560" y="244" fill="#64748b" font-size="10">45 MINS AGO</text>
      <text x="64" y="264" fill="#ffffff" font-size="12" font-weight="600">Transferred 8 Oxygen Beds to Ernakulam North Taluk Facility</text>
      <text x="64" y="284" fill="#94a3b8" font-size="11">Surge Buffer Triggered: Migrant Intake spike (+28% in 48h)</text>
      <text x="64" y="298" fill="#64748b" font-size="10">System Status: Balanced Occupancy across Zone 4</text>

      <!-- Item 4 -->
      <rect x="0" y="324" width="679" height="92" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <rect x="16" y="340" width="36" height="36" rx="8" fill="#f59e0b" fill-opacity="0.2"/>
      <text x="24" y="362" fill="#fbbf24" font-size="14" font-weight="700">₹</text>
      <text x="64" y="352" fill="#fbbf24" font-size="11" font-weight="700">PM-JAY CROSS-BORDER CLAIM CLEARED</text>
      <text x="560" y="352" fill="#64748b" font-size="10">1 HOUR AGO</text>
      <text x="64" y="372" fill="#ffffff" font-size="12" font-weight="600">Claim ID: CLM-2026-90412 • Amount: ₹24,800</text>
      <text x="64" y="392" fill="#94a3b8" font-size="11">Hospital: General Hospital Ernakulam | Beneficiary Domicile: Bihar</text>
      <text x="64" y="406" fill="#64748b" font-size="10">Settlement Gateway: National Health Authority (Instant Auto-Adjudication)</text>
    </g>

    <!-- Rapid Response Governance Controls -->
    <g transform="translate(28, 520)">
      <rect x="0" y="0" width="679" height="190" rx="12" fill="#0a1222" stroke="#1e293b" stroke-width="1"/>
      <text x="20" y="28" fill="#ffffff" font-size="14" font-weight="700">Governance Command &amp; Policy Directives</text>

      <rect x="20" y="45" width="200" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="35" y="68" fill="#38bdf8" font-size="12" font-weight="700">Mandate Health Camp</text>
      <text x="35" y="84" fill="#94a3b8" font-size="10">Select High-Risk Wards</text>

      <rect x="235" y="45" width="200" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="250" y="68" fill="#f59e0b" font-size="12" font-weight="700">Dispatch Antimalarials</text>
      <text x="250" y="84" fill="#94a3b8" font-size="10">Emergency Buffer Depots</text>

      <rect x="450" y="45" width="205" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="465" y="68" fill="#34d399" font-size="12" font-weight="700">Inter-State Sync Audit</text>
      <text x="465" y="84" fill="#94a3b8" font-size="10">Validate FHIR Node Hashes</text>

      <!-- Bottom Broadcast message preview -->
      <rect x="20" y="110" width="635" height="60" rx="6" fill="#131c31" stroke="#1e293b" stroke-width="1"/>
      <text x="35" y="132" fill="#94a3b8" font-size="11">ACTIVE GOVERNANCE ADVISORY (Multilingual Broadcast SMS):</text>
      <text x="35" y="152" fill="#38bdf8" font-size="12" font-weight="600">"Free Health Screening &amp; Respirator Distribution camp at Perumbavoor Hub tomorrow 9 AM."</text>
