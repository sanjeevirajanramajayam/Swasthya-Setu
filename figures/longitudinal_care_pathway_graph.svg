<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" style="background:#090d16; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="nodeActiveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Top App Navigation Bar -->
  <rect x="0" y="0" width="1920" height="72" fill="#0d1527" stroke="#1e293b" stroke-width="1"/>
  <circle cx="36" cy="36" r="16" fill="#0284c7"/>
  <path d="M 28 36 L 44 36 M 36 28 L 36 44" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <text x="66" y="42" fill="#f8fafc" font-size="19" font-weight="700" letter-spacing="0.5">NATIONAL MIGRANT HEALTH RECORD SYSTEM</text>
  <rect x="520" y="24" width="140" height="26" rx="6" fill="#0369a1" fill-opacity="0.3"/>
  <text x="532" y="42" fill="#38bdf8" font-size="12" font-weight="700">FHIR R4 INTEROPERABLE</text>

  <!-- Patient Context Badge in Nav -->
  <rect x="1350" y="16" width="530" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="1375" cy="37" r="13" fill="#38bdf8"/>
  <text x="1371" y="41" fill="#ffffff" font-size="12" font-weight="700">RK</text>
  <text x="1398" y="34" fill="#f8fafc" font-size="13" font-weight="600">Ramesh Kumar (34 M)</text>
  <text x="1398" y="49" fill="#94a3b8" font-size="11">UMHID: IND-MIG-2026-8841 | Bihar → Maharashtra → Kerala</text>
  <rect x="1780" y="24" width="85" height="24" rx="4" fill="#10b981" fill-opacity="0.2"/>
  <text x="1792" y="40" fill="#34d399" font-size="11" font-weight="700">● VERIFIED</text>

  <!-- Sub Header / Title -->
  <text x="40" y="115" fill="#ffffff" font-size="24" font-weight="800">Figure 4.4 – Interactive Longitudinal Care Pathway Graph</text>
  <text x="40" y="140" fill="#94a3b8" font-size="14">Cross-state patient journey mapping clinical encounters, diagnoses, medications, and biometric health checkpoints across federated hospitals.</text>

  <!-- Top Metric Cards -->
  <g transform="translate(40, 160)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="280" height="88" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
    <text x="20" y="30" fill="#94a3b8" font-size="12" font-weight="600" text-transform="uppercase">Total Federated Encounters</text>
    <text x="20" y="65" fill="#f8fafc" font-size="28" font-weight="800">8 Encounters</text>
    <text x="170" y="65" fill="#34d399" font-size="12" font-weight="600">3 States</text>

    <!-- Card 2 -->
    <rect x="300" y="0" width="280" height="88" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
    <text x="320" y="30" fill="#94a3b8" font-size="12" font-weight="600" text-transform="uppercase">Hospital Facilities</text>
    <text x="320" y="65" fill="#38bdf8" font-size="28" font-weight="800">4 Networks</text>
    <text x="460" y="65" fill="#94a3b8" font-size="12">100% Synced</text>

    <!-- Card 3 -->
    <rect x="600" y="0" width="280" height="88" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
    <text x="620" y="30" fill="#94a3b8" font-size="12" font-weight="600" text-transform="uppercase">Active Prescriptions (Rx)</text>
    <text x="620" y="65" fill="#fbbf24" font-size="28" font-weight="800">2 Active</text>
    <text x="730" y="65" fill="#94a3b8" font-size="12">12 Historical</text>

    <!-- Card 4 -->
    <rect x="900" y="0" width="280" height="88" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
    <text x="920" y="30" fill="#94a3b8" font-size="12" font-weight="600" text-transform="uppercase">Diagnostic Lab Reports</text>
    <text x="920" y="65" fill="#c084fc" font-size="28" font-weight="800">6 Panels</text>
    <text x="1030" y="65" fill="#34d399" font-size="12">Normal Ranges</text>

    <!-- Card 5 (Filter / Action) -->
    <rect x="1200" y="0" width="680" height="88" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
    <text x="1225" y="32" fill="#e2e8f0" font-size="13" font-weight="700">Corridor Trajectory Filters</text>
    <rect x="1225" y="44" width="130" height="30" rx="6" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1"/>
    <text x="1245" y="64" fill="#38bdf8" font-size="11" font-weight="700">All Timeline (3 Yrs)</text>
    <rect x="1365" y="44" width="130" height="30" rx="6" fill="#334155" fill-opacity="0.4"/>
    <text x="1385" y="64" fill="#94a3b8" font-size="11" font-weight="600">Patna, Bihar</text>
    <rect x="1505" y="44" width="130" height="30" rx="6" fill="#334155" fill-opacity="0.4"/>
    <text x="1520" y="64" fill="#94a3b8" font-size="11" font-weight="600">Mumbai, MH</text>
    <rect x="1645" y="44" width="130" height="30" rx="6" fill="#334155" fill-opacity="0.4"/>
    <text x="1660" y="64" fill="#94a3b8" font-size="11" font-weight="600">Ernakulam, KL</text>
  </g>

  <!-- Main Longitudinal Pathway Visualizer Panel -->
  <g transform="translate(40, 270)">
    <rect x="0" y="0" width="1280" height="770" rx="16" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Chart Header -->
    <text x="30" y="40" fill="#f8fafc" font-size="17" font-weight="700">Interactive Longitudinal Health Pathway (Multi-Hospital Care Continuity)</text>
    <text x="30" y="62" fill="#64748b" font-size="12">Horizontal chronological timeline mapped across state border crossings, hospital admissions, and clinical diagnoses.</text>

    <!-- Timeline Axis Track -->
    <line x1="80" y1="360" x2="1200" y2="360" stroke="#334155" stroke-width="4" stroke-dasharray="8 6"/>
    <line x1="80" y1="360" x2="1080" y2="360" stroke="url(#glowLine)" stroke-width="4" filter="url(#glow)"/>
    <line x1="80" y1="360" x2="1080" y2="360" stroke="#38bdf8" stroke-width="4"/>

    <!-- Years Marker Axis -->
    <text x="120" y="400" fill="#64748b" font-size="13" font-weight="700">2023 Q2 (Origin)</text>
    <text x="440" y="400" fill="#64748b" font-size="13" font-weight="700">2024 Q1 (Transit Hub)</text>
    <text x="760" y="400" fill="#64748b" font-size="13" font-weight="700">2025 Q3 (Work Site 1)</text>
    <text x="1050" y="400" fill="#34d399" font-size="13" font-weight="800">2026 CURRENT (Site 2)</text>

    <!-- Milestone Node 1 (Patna) -->
    <g transform="translate(150, 0)">
      <!-- Connecting stem -->
      <line x1="0" y1="360" x2="0" y2="170" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="0" cy="360" r="14" fill="#0284c7" stroke="#ffffff" stroke-width="3"/>
      <circle cx="0" cy="360" r="6" fill="#ffffff"/>
      <!-- Node Card -->
      <rect x="-110" y="90" width="220" height="150" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <rect x="-110" y="90" width="220" height="26" rx="8" fill="#0284c7" fill-opacity="0.2"/>
      <text x="-98" y="108" fill="#38bdf8" font-size="11" font-weight="700">PATNA, BIHAR • MAY 2023</text>
      <text x="-98" y="134" fill="#ffffff" font-size="13" font-weight="700">Patna Medical College</text>
      <text x="-98" y="152" fill="#94a3b8" font-size="11">Encounter: Intake &amp; Td Booster</text>
      <rect x="-98" y="165" width="85" height="18" rx="4" fill="#10b981" fill-opacity="0.2"/>
      <text x="-92" y="178" fill="#34d399" font-size="9" font-weight="700">VACCINE DONE</text>
      <text x="-98" y="200" fill="#cbd5e1" font-size="10">BP: 120/80 • BMI: 21.8</text>
      <text x="-98" y="216" fill="#64748b" font-size="10">Dr. A. Verma (Govt PHC)</text>
    </g>

    <!-- Milestone Node 2 (Mumbai) -->
    <g transform="translate(470, 0)">
      <line x1="0" y1="360" x2="0" y2="520" stroke="#818cf8" stroke-width="2"/>
      <circle cx="0" cy="360" r="14" fill="#6366f1" stroke="#ffffff" stroke-width="3"/>
      <circle cx="0" cy="360" r="6" fill="#ffffff"/>
      <!-- Card Below Axis -->
      <rect x="-115" y="470" width="230" height="160" rx="10" fill="#0f172a" stroke="#818cf8" stroke-width="1.5"/>
      <rect x="-115" y="470" width="230" height="26" rx="8" fill="#6366f1" fill-opacity="0.2"/>
      <text x="-103" y="488" fill="#a5b4fc" font-size="11" font-weight="700">MUMBAI, MH • FEB 2024</text>
      <text x="-103" y="514" fill="#ffffff" font-size="13" font-weight="700">Sion Municipal Hospital</text>
      <text x="-103" y="532" fill="#94a3b8" font-size="11">Diagnosis: Occupational Rhinitis</text>
      <rect x="-103" y="545" width="105" height="18" rx="4" fill="#f59e0b" fill-opacity="0.2"/>
      <text x="-98" y="558" fill="#fbbf24" font-size="9" font-weight="700">DUST EXPOSURE</text>
      <text x="-103" y="580" fill="#cbd5e1" font-size="10">Rx: Levocetirizine + Inhaler</text>
      <text x="-103" y="596" fill="#64748b" font-size="10">Chest X-Ray: Clear Basal Zones</text>
    </g>

    <!-- Milestone Node 3 (Kochi / Ernakulam 1) -->
    <g transform="translate(790, 0)">
      <line x1="0" y1="360" x2="0" y2="170" stroke="#f59e0b" stroke-width="2"/>
      <circle cx="0" cy="360" r="14" fill="#d97706" stroke="#ffffff" stroke-width="3"/>
      <circle cx="0" cy="360" r="6" fill="#ffffff"/>
      <!-- Card Above Axis -->
      <rect x="-115" y="90" width="230" height="150" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
      <rect x="-115" y="90" width="230" height="26" rx="8" fill="#f59e0b" fill-opacity="0.2"/>
      <text x="-103" y="108" fill="#fde68a" font-size="11" font-weight="700">ERNAKULAM, KL • NOV 2025</text>
      <text x="-103" y="134" fill="#ffffff" font-size="13" font-weight="700">General Hospital Ernakulam</text>
      <text x="-103" y="152" fill="#94a3b8" font-size="11">Diagnosis: Lumbar Muscle Strain</text>
      <rect x="-103" y="165" width="95" height="18" rx="4" fill="#38bdf8" fill-opacity="0.2"/>
      <text x="-98" y="178" fill="#38bdf8" font-size="9" font-weight="700">PHYSIOTHERAPY</text>
      <text x="-103" y="200" fill="#cbd5e1" font-size="10">Treatment: NSAID Gel + Rest</text>
      <text x="-103" y="216" fill="#64748b" font-size="10">Workplace heavy lifting hazard</text>
    </g>

    <!-- Milestone Node 4 (Active Encounter - Kochi General Hospital) -->
    <g transform="translate(1080, 0)">
      <line x1="0" y1="360" x2="0" y2="520" stroke="#10b981" stroke-width="3"/>
      <circle cx="0" cy="360" r="18" fill="url(#nodeActiveGrad)" stroke="#ffffff" stroke-width="4" filter="url(#glow)"/>
      <circle cx="0" cy="360" r="7" fill="#ffffff"/>
      <!-- Active Highlight Card -->
      <rect x="-135" y="470" width="250" height="180" rx="12" fill="#092f25" stroke="#34d399" stroke-width="2"/>
      <rect x="-135" y="470" width="250" height="28" rx="10" fill="#10b981" fill-opacity="0.3"/>
      <text x="-120" y="489" fill="#a7f3d0" font-size="11" font-weight="800">● ACTIVE ENCOUNTER (2026)</text>
      <text x="-120" y="516" fill="#ffffff" font-size="14" font-weight="800">Govt Medical College</text>
      <text x="-120" y="534" fill="#94a3b8" font-size="11">Triage: Acute Exertional Cough</text>
      <rect x="-120" y="548" width="115" height="20" rx="5" fill="#ef4444" fill-opacity="0.25"/>
      <text x="-112" y="562" fill="#f87171" font-size="10" font-weight="700">SPO2 94% MONITOR</text>
      <text x="-120" y="588" fill="#e2e8f0" font-size="11">Nebulization + Sputum Culture</text>
      <text x="-120" y="606" fill="#34d399" font-size="11" font-weight="700">FHIR Record Synced Across Corridors</text>
    </g>
  </g>

  <!-- Right Side Inspection & FHIR Detail Flyout Panel -->
  <g transform="translate(1340, 270)">
    <rect x="0" y="0" width="540" height="770" rx="16" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Flyout Header -->
    <rect x="0" y="0" width="540" height="60" rx="16" fill="#1e293b"/>
    <text x="24" y="36" fill="#ffffff" font-size="16" font-weight="700">Encounter Deep-Dive &amp; FHIR Audit</text>
    <rect x="420" y="16" width="95" height="28" rx="6" fill="#0284c7" fill-opacity="0.3"/>
    <text x="432" y="35" fill="#38bdf8" font-size="11" font-weight="700">JSON VIEW</text>

    <!-- Patient Migration Path Summary -->
    <rect x="24" y="80" width="492" height="70" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="40" y="105" fill="#94a3b8" font-size="11" font-weight="600">INTER-STATE MIGRANT HEALTH PASS CORRIDOR</text>
    <text x="40" y="130" fill="#38bdf8" font-size="14" font-weight="700">Bihar (Origin) ➔ Maharashtra (Transit) ➔ Kerala (Host)</text>

    <!-- Longitudinal Biometric Chart -->
    <text x="24" y="180" fill="#f8fafc" font-size="14" font-weight="700">Longitudinal Vitals Trajectory</text>
    <rect x="24" y="195" width="492" height="150" rx="10" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
    <!-- Mini SVG Line Chart for Blood Pressure and SpO2 -->
    <polyline points="50,300 160,285 270,290 380,260 480,270" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="50" cy="300" r="4" fill="#38bdf8"/>
    <circle cx="160" cy="285" r="4" fill="#38bdf8"/>
    <circle cx="270" cy="290" r="4" fill="#38bdf8"/>
    <circle cx="380" cy="260" r="4" fill="#38bdf8"/>
    <circle cx="480" cy="270" r="4" fill="#38bdf8"/>
    <text x="40" y="225" fill="#38bdf8" font-size="11" font-weight="700">● Systolic BP (mmHg)</text>

    <polyline points="50,250 160,252 270,248 380,235 480,230" fill="none" stroke="#34d399" stroke-width="3"/>
    <circle cx="50" cy="250" r="4" fill="#34d399"/>
    <circle cx="160" cy="252" r="4" fill="#34d399"/>
    <circle cx="270" cy="248" r="4" fill="#34d399"/>
    <circle cx="380" cy="235" r="4" fill="#34d399"/>
    <circle cx="480" cy="230" r="4" fill="#34d399"/>
    <text x="200" y="225" fill="#34d399" font-size="11" font-weight="700">● SpO2 Oxygen %</text>
    <text x="420" y="330" fill="#64748b" font-size="10">2023 ➔ 2026</text>

    <!-- FHIR Resource Payload Snippet -->
    <text x="24" y="375" fill="#f8fafc" font-size="14" font-weight="700">FHIR R4 Encounter Resource Payload</text>
    <rect x="24" y="390" width="492" height="230" rx="10" fill="#050811" stroke="#334155" stroke-width="1"/>
    <text x="40" y="415" fill="#38bdf8" font-family="monospace" font-size="12">"resourceType": "Encounter",</text>
    <text x="40" y="435" fill="#e2e8f0" font-family="monospace" font-size="12">"id": "enc-kl-2026-0914",</text>
    <text x="40" y="455" fill="#34d399" font-family="monospace" font-size="12">"status": "in-progress",</text>
    <text x="40" y="475" fill="#f59e0b" font-family="monospace" font-size="12">"subject": { "reference": "Patient/IND-MIG-2026-8841" },</text>
    <text x="40" y="495" fill="#e2e8f0" font-family="monospace" font-size="12">"serviceProvider": { "name": "Govt Med College, KL" },</text>
    <text x="40" y="515" fill="#c084fc" font-family="monospace" font-size="12">"reasonCode": [{ "text": "Occupational Bronchospasm" }],</text>
    <text x="40" y="535" fill="#94a3b8" font-family="monospace" font-size="12">"consentStatus": "ABHA-OTP-AUTHENTICATED",</text>
    <text x="40" y="555" fill="#38bdf8" font-family="monospace" font-size="12">"crossCorridorSync": "FEDERATED_SUCCESS"</text>

    <!-- Export Action Buttons -->
    <rect x="24" y="640" width="235" height="48" rx="8" fill="#0284c7"/>
    <text x="60" y="670" fill="#ffffff" font-size="13" font-weight="700">Download Care Pass PDF</text>

    <rect x="281" y="640" width="235" height="48" rx="8" fill="#10b981"/>
    <text x="315" y="670" fill="#ffffff" font-size="13" font-weight="700">Export FHIR Bundle XML</text>
  </g>
</svg>
